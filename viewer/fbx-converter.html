<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>FBX → GLB Converter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: .5rem; }
    p  { opacity: .6; font-size: .9rem; margin-bottom: 2rem; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 2rem; width: 100%; max-width: 520px; }
    label { display: block; margin-bottom: .4rem; font-size: .85rem; opacity: .7; }
    input[type=file] { width: 100%; padding: .7rem; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; color: #fff; cursor: pointer; margin-bottom: 1.2rem; }
    button { width: 100%; padding: .9rem; background: #4a9eff; border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; }
    button:hover { background: #3a8eef; }
    button:disabled { background: #333; cursor: not-allowed; opacity: .6; }
    #log { margin-top: 1.2rem; background: rgba(0,0,0,.4); border-radius: 8px; padding: 1rem; font-size: .8rem; font-family: monospace; line-height: 1.8; min-height: 60px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .ok   { color: #4aff8a; }
    .err  { color: #ff6b6b; }
    .info { color: #4a9eff; }
    #preview { margin-top: 1rem; width: 100%; height: 200px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>FBX → GLB Converter</h1>
  <p>Usa Three.js per convertire FBX (anche vecchi) in GLB</p>

  <div class="card">
    <label>Seleziona file FBX</label>
    <input type="file" id="fbxFile" accept=".fbx,.FBX" />
    <button id="convertBtn" disabled>Converti in GLB</button>
    <canvas id="preview"></canvas>
    <div id="log">In attesa del file...</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const logEl  = document.getElementById('log');
const btnEl  = document.getElementById('convertBtn');
const fileEl = document.getElementById('fbxFile');
const canvas = document.getElementById('preview');

let loadedModel = null;
let renderer, previewScene, previewCamera, controls;

function log(msg, cls = '') {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() { logEl.innerHTML = ''; }

// Preview 3D
function initPreview() {
  canvas.style.display = 'block';
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(canvas.offsetWidth, 200);
  renderer.setPixelRatio(window.devicePixelRatio);

  previewScene = new THREE.Scene();
  previewCamera = new THREE.PerspectiveCamera(60, canvas.offsetWidth / 200, 0.1, 5000);
  previewCamera.position.set(0, 5, 20);

  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  previewScene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(10, 20, 10);
  previewScene.add(dir);

  controls = new OrbitControls(previewCamera, canvas);
  controls.enableDamping = true;

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(previewScene, previewCamera);
  }
  animate();
}

// Carica FBX
fileEl.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  clearLog();
  log(`📂 File: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`, 'info');
  btnEl.disabled = true;

  const arrayBuffer = await file.arrayBuffer();
  log('🔄 Parsing FBX con Three.js...', 'info');

  try {
    const loader = new FBXLoader();
    const object = loader.parse(arrayBuffer, '');
    loadedModel = object;

    // Statistiche
    let meshCount = 0, vertCount = 0;
    object.traverse(c => {
      if (c.isMesh) {
        meshCount++;
        vertCount += c.geometry.attributes.position?.count || 0;
      }
    });
    log(`✅ FBX caricato: ${meshCount} mesh, ${vertCount.toLocaleString()} vertici`, 'ok');
    log(`   Animazioni: ${object.animations.length}`, 'info');

    // Centra il modello
    const box = new THREE.Box3().setFromObject(object);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    object.position.sub(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    log(`   Dimensioni: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`, 'info');

    // Preview
    if (!renderer) initPreview();
    // Rimuovi modello precedente
    while (previewScene.children.length > 3) previewScene.remove(previewScene.children[3]);
    previewScene.add(object);
    previewCamera.position.set(0, maxDim * 0.5, maxDim * 1.5);
    controls.target.set(0, 0, 0);
    controls.update();

    btnEl.disabled = false;
    log('👆 Clicca "Converti in GLB" per scaricare', 'info');
  } catch(err) {
    log(`❌ Errore: ${err.message}`, 'err');
    console.error(err);
  }
});

// Esporta GLB
btnEl.addEventListener('click', () => {
  if (!loadedModel) return;
  btnEl.disabled = true;
  log('🔄 Esportazione GLB...', 'info');

  const exporter = new GLTFExporter();
  const opts = {
    binary: true,
    animations: loadedModel.animations,
    includeCustomExtensions: false,
    forceIndices: true,
    truncateDrawRange: true
  };

  exporter.parse(
    loadedModel,
    (result) => {
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = 'environment.glb';
      a.click();
      URL.revokeObjectURL(url);
      log(`✅ GLB scaricato! (${(result.byteLength / 1024 / 1024).toFixed(1)} MB)`, 'ok');
      log('📁 Sposta environment.glb in: viewer/models/', 'info');
      btnEl.disabled = false;
    },
    (err) => {
      log(`❌ Errore export: ${err}`, 'err');
      btnEl.disabled = false;
    },
    opts
  );
});
</script>
</body>
</html>
