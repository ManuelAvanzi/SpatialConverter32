<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }

    /* HUD caricamento */
    #loader {
      position: fixed; inset: 0; background: #0d0d1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; color: #fff;
    }
    #loader h1 { font-size: 1.4rem; margin-bottom: 1.5rem; opacity: .8; }
    #progress-bar { width: 320px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    #progress-fill { height: 100%; background: #4a9eff; width: 0%; transition: width .2s; }
    #progress-label { margin-top: .6rem; font-size: .85rem; opacity: .5; }

    /* Mirino centrale */
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,.7);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after  { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

    /* Pannello interactable */
    #interact-panel {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 14px 24px;
      color: #fff; text-align: center;
      opacity: 0; transition: all .25s ease;
      pointer-events: none; z-index: 20;
      max-width: 400px;
    }
    #interact-panel.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    #interact-panel .icon {
      font-size: 1.6rem; margin-bottom: 6px;
    }
    #interact-panel .label {
      font-size: 1rem; font-weight: 600; margin-bottom: 4px;
    }
    #interact-panel .hint {
      font-size: .75rem; opacity: .5;
    }

    /* Notifica azione */
    #notification {
      position: fixed; top: 68px; left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(74,158,255,.9); color: #fff;
      border-radius: 8px; padding: 10px 20px;
      font-size: .9rem; opacity: 0;
      transition: all .3s ease; z-index: 30;
      pointer-events: none;
    }
    #notification.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* HUD Quest */
    #quest-panel {
      position: fixed; top: 20px; right: 20px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; padding: 12px 16px;
      color: #fff; min-width: 200px; z-index: 20;
      display: none;
    }
    #quest-panel h3 { font-size: .8rem; opacity: .5; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    #quest-title { font-size: .95rem; font-weight: 600; margin-bottom: 8px; }
    #quest-progress { font-size: .8rem; opacity: .7; }
    #quest-bar { height: 4px; background: #333; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    #quest-fill { height: 100%; background: #4a9eff; transition: width .4s; }

    /* Teleport list */
    #teleport-panel {
      position: fixed; bottom: 20px; left: 20px;
      display: flex; flex-direction: column; gap: 8px; z-index: 20;
    }
    .tp-btn {
      background: rgba(0,0,0,.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff; padding: 8px 14px; border-radius: 8px;
      cursor: pointer; font-size: .8rem;
      transition: background .2s;
    }
    .tp-btn:hover { background: rgba(74,158,255,.4); }

    /* Istruzioni */
    #instructions {
      position: fixed; bottom: 20px; right: 20px;
      color: rgba(255,255,255,.35); font-size: .72rem;
      line-height: 1.7; text-align: right; z-index: 10;
      pointer-events: none;
    }

    /* Pulsante VR */
    #vr-btn {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(74,158,255,.85); color: #fff;
      border: none; border-radius: 10px; padding: 10px 24px;
      font-size: .9rem; cursor: pointer; z-index: 20;
      display: none;
    }
    #vr-btn:hover { background: #4a9eff; }

    /* Toolbar in alto al centro */
    #toolbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: row; gap: 8px; z-index: 30;
    }
    .tool-btn {
      background: rgba(0,0,0,.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.15); color: #fff;
      padding: 9px 14px; border-radius: 8px; cursor: pointer;
      font-size: .82rem; display: flex; align-items: center; gap: 8px;
      transition: background .2s; white-space: nowrap;
    }
    .tool-btn:hover { background: rgba(74,158,255,.35); }
    .tool-btn.active { background: rgba(74,158,255,.5); border-color: #4a9eff; }

    /* HUD coordinate camera */
    #cam-hud {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
      padding: 6px 12px; color: rgba(255,255,255,.75);
      font-size: .72rem; font-family: monospace; z-index: 20;
      pointer-events: none; line-height: 1.6;
    }

    /* Editor coordinate manuale */
    #coord-editor {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.8); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,159,74,.5); border-radius: 10px;
      padding: 10px 14px; color: #fff; z-index: 40; display: none;
      font-size: .8rem;
    }
    #coord-editor .ce-title { font-size: .75rem; color: #ffb060; margin-bottom: 8px; font-weight: 600; }
    #coord-editor .ce-row { display: flex; align-items: center; gap: 6px; }
    #coord-editor .ce-row label { color: #ff9f4a; font-weight: 600; width: 12px; }
    #coord-editor .ce-row input {
      width: 88px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      color: #fff; border-radius: 5px; padding: 4px 6px; font-size: .8rem; font-family: monospace;
    }
    #coord-editor .ce-actions { display: flex; gap: 6px; margin-top: 8px; }
    #coord-editor .ce-actions button {
      flex: 1; background: rgba(255,159,74,.25); border: 1px solid rgba(255,159,74,.5);
      color: #ffd0a0; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: .72rem;
    }
    #coord-editor .ce-actions button:hover { background: rgba(255,159,74,.45); }
    #coord-editor #ce-close { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #ccc; }

    /* Pannello modelli — a sinistra, scrollabile */
    #models-panel {
      position: fixed; top: 20px; left: 20px;
      background: rgba(0,0,0,.7); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
      padding: 12px 16px; color: #fff; z-index: 20;
      min-width: 320px; max-width: 440px;
      max-height: calc(100vh - 40px); overflow-y: auto;
      display: none;
    }
    #models-panel h3 { font-size: .75rem; color: #ffd400; opacity: 1; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 10px; }
    #models-panel::-webkit-scrollbar { width: 4px; }
    #models-panel::-webkit-scrollbar-track { background: transparent; }
    #models-panel::-webkit-scrollbar-thumb { background: rgba(255,212,0,.35); border-radius: 2px; }
    .model-item { display: flex; align-items: center; gap: 8px;
      font-size: .82rem; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .model-item:last-child { border-bottom: none; }
    .model-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .model-info { opacity: .55; font-size: .72rem; }
    .model-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .play-btn {
      background: rgba(74,158,255,.2); border: 1px solid rgba(74,158,255,.4);
      color: #4a9eff; border-radius: 4px; padding: 2px 8px;
      cursor: pointer; font-size: .72rem; flex-shrink: 0;
      transition: background .15s;
    }
    .play-btn:hover { background: rgba(74,158,255,.45); }
    .play-btn.playing { background: rgba(255,100,100,.25); border-color: rgba(255,100,100,.5); color: #ff8080; }
    .goto-btn {
      background: rgba(74,255,138,.15); border: 1px solid rgba(74,255,138,.35);
      color: #4aff8a; border-radius: 4px; padding: 2px 7px;
      cursor: pointer; font-size: .72rem; flex-shrink: 0;
      transition: background .15s;
    }
    .goto-btn:hover { background: rgba(74,255,138,.35); }
    .gizmo-btn {
      background: rgba(255,159,74,.18); border: 1px solid rgba(255,159,74,.4);
      color: #ffb060; border-radius: 4px; padding: 2px 7px;
      cursor: pointer; font-size: .72rem; flex-shrink: 0; transition: background .15s;
    }
    .gizmo-btn:hover { background: rgba(255,159,74,.4); }
    .gizmo-btn.active { background: rgba(255,159,74,.6); border-color: #ff9f4a; color: #fff; }
    .confirm-btn {
      background: rgba(74,255,138,.18); border: 1px solid rgba(74,255,138,.4);
      color: #6bffa0; border-radius: 4px; padding: 2px 7px;
      cursor: pointer; font-size: .72rem; flex-shrink: 0; transition: background .15s;
    }
    .confirm-btn:hover { background: rgba(74,255,138,.45); }
    .delete-btn {
      background: rgba(255,60,60,.18); border: 1px solid rgba(255,60,60,.4);
      color: #ff8080; border-radius: 4px; padding: 2px 7px;
      cursor: pointer; font-size: .72rem; flex-shrink: 0; transition: background .15s;
    }
    .delete-btn:hover { background: rgba(255,60,60,.5); color:#fff; }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <h1 id="loader-title">Caricamento ambiente...</h1>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="progress-label">Inizializzazione...</div>
</div>

<!-- UI -->
<div id="crosshair"></div>
<div id="interact-panel">
  <div class="icon">☝️</div>
  <div class="label" id="interact-label"></div>
  <div class="hint">Clicca per interagire</div>
</div>
<div id="notification"></div>
<div id="quest-panel">
  <h3>Missione attiva</h3>
  <div id="quest-title"></div>
  <div id="quest-progress"></div>
  <div id="quest-bar"><div id="quest-fill" style="width:0%"></div></div>
</div>
<div id="teleport-panel"></div>

<!-- Pannello modelli -->
<div id="models-panel">
  <h3>Modelli caricati</h3>
  <div id="models-list"></div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tool-btn" id="btn-overhead"  title="Vista dall'alto">🗺️ Vista aerea</button>
  <button class="tool-btn" id="btn-models"    title="Modelli caricati">📦 Modelli</button>
  <button class="tool-btn" id="btn-entrance"  title="Salva punto d'entrata (posizione iniziale del personaggio)">📍 Entrata</button>
</div>
<div id="instructions">
  WASD · Muoviti<br>
  Tieni premuto + trascina · Ruota vista<br>
  Click su 🖐 · Interagisci
</div>
<button id="vr-btn">🥽 Entra in VR</button>
<div id="cam-hud">X 0.00 &nbsp; Y 0.00 &nbsp; Z 0.00</div>

<!-- Editor coordinate manuale (appare con il gizmo) -->
<div id="coord-editor">
  <div class="ce-title">✥ <span id="ce-name">oggetto</span></div>
  <div class="ce-row">
    <label>X</label><input id="ce-x" type="number" step="0.5" />
    <label>Y</label><input id="ce-y" type="number" step="0.5" />
    <label>Z</label><input id="ce-z" type="number" step="0.5" />
  </div>
  <div class="ce-actions">
    <button id="ce-apply">Applica &amp; salva</button>
    <button id="ce-here">Porta davanti a me</button>
    <button id="ce-close">Chiudi</button>
  </div>
</div>

<!-- Three.js via CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ─── Stato globale ─────────────────────────────────────────────────────────
let scene, camera, renderer;
let sceneData = null;
let loadedManifest = null;   // manifest caricato prima del GLB
let interactableMeshes = [];
let animationMixers = [];
let clock = new THREE.Clock();
let questCompleted = new Set();

// ─── Modalità camera ──────────────────────────────────────────────────────
let cameraMode = 'fps';   // 'fps' | 'overhead'
let orbitControls = null;
const fpsCameraState = { pos: new THREE.Vector3(), yaw: 0, pitch: 0 };
const loadedModels = [];
const MODEL_COLORS = ['#4a9eff','#4aff8a','#ff9f4a','#ff4a8a','#c04aff','#4affee'];
let sceneBoundingBox = null;  // aggiornato dopo ogni caricamento modello

// ─── Gizmo posizionamento (TransformControls) ───────────────────────────────
let transformControls = null;
let gizmoTarget = null;            // oggetto attualmente agganciato al gizmo
let gizmoDragging = false;         // true mentre si trascina un handle
const POS_STORE_KEY  = 'sc32-positions';   // localStorage: { nome: [x,y,z] }
const ENTRANCE_KEY   = 'sc32-entrance';    // localStorage: {x,y,z,yaw,pitch}

function loadSavedEntrance() {
  try { return JSON.parse(localStorage.getItem(ENTRANCE_KEY) || 'null'); } catch { return null; }
}
function saveEntrance() {
  const ep = {
    x: camera.position.x, y: camera.position.y, z: camera.position.z,
    yaw: cameraYaw, pitch: cameraPitch
  };
  localStorage.setItem(ENTRANCE_KEY, JSON.stringify(ep));
  document.getElementById('btn-entrance').classList.add('active');
  showNotification('📍 Punto d\'entrata salvato! Sarà la posizione iniziale ad ogni caricamento.');
}
function applyEntrancePoint() {
  const ep = loadSavedEntrance();
  if (!ep) return;
  camera.position.set(ep.x, ep.y, ep.z);
  cameraYaw   = ep.yaw   ?? 0;
  cameraPitch = ep.pitch ?? 0;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = cameraYaw;
  camera.rotation.x = cameraPitch;
}

function loadSavedPositions() {
  try { return JSON.parse(localStorage.getItem(POS_STORE_KEY) || '{}'); }
  catch { return {}; }
}
function saveObjectPosition(name, obj) {
  const all = loadSavedPositions();
  const p = obj.position;
  all[name] = [ +p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4) ];
  localStorage.setItem(POS_STORE_KEY, JSON.stringify(all));
  SAVED_POSITIONS[name] = all[name];
  showNotification(`💾 Posizione salvata: ${name}`);
}

// Posizioni salvate (positions.json permanente + localStorage live), caricate all'avvio
let SAVED_POSITIONS = {};
const staticRoots = {};            // nome pezzo statico → Object3D (posizionabile)
let environmentScene = null;       // gltf.scene della scena statica

async function loadAllSavedPositions() {
  let base = {};
  try {
    const r = await fetch('./models/gltfModels/positions.json?t=' + Date.now());
    if (r.ok) base = await r.json();
  } catch {}
  return { ...base, ...loadSavedPositions() };
}
function applySavedToObject(obj, name) {
  obj.userData.gizmoName = name;
  const s = SAVED_POSITIONS[name];
  if (s) obj.position.set(s[0], s[1], s[2]);
}
// Collega i pulsanti ✥/✓ di una riga del pannello a un oggetto posizionabile
function wireGizmoControls(item, name, root) {
  const gb = item.querySelector('.gizmo-btn');
  if (gb) gb.addEventListener('click', e => { e.stopPropagation(); toggleGizmo(root, gb); });
  const cb = item.querySelector('.confirm-btn');
  if (cb) cb.addEventListener('click', e => {
    e.stopPropagation();
    saveObjectPosition(name, root);
    if (gizmoTarget === root) toggleGizmo(root, gb);
  });
}

// ─── Navigazione drag-to-look ──────────────────────────────────────────────
let isDragging = false;
let dragMoved = false;          // distingue drag da click
let dragPrev = { x: 0, y: 0 };
let cameraYaw = 0;              // rotazione orizzontale (Y)
let cameraPitch = -0.1;         // rotazione verticale (X)
const LOOK_SPEED        = 0.003;
const MOVE_SPEED        = 4;       // velocità base (walk)
const SPRINT_MULTIPLIER = 2.5;     // moltiplicatore con Shift (come Spatial)
const GRAVITY           = -18;     // m/s² verso il basso
const JUMP_FORCE        = 6.5;     // m/s velocità iniziale salto
const MAX_JUMPS         = 2;       // doppio salto

const keys = {};
const moveDir = new THREE.Vector3();
// Vettori di direzione calcolati dal yaw
const fwdVec   = new THREE.Vector3();
const rightVec = new THREE.Vector3();

// ─── Fisica salto ─────────────────────────────────────────────────────────
let velocityY    = 0;
let isOnGround   = true;
let jumpCount    = 0;
let playerGroundY = 1.7;   // aggiornato ogni frame quando si è a terra

// ─── Init ──────────────────────────────────────────────────────────────────
async function init() {
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

  // Camera
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 1.7, 0);

  // Luce ambiente
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.far = 200;
  scene.add(dirLight);

  // Posiziona camera direttamente nella scena
  camera.rotation.order = 'YXZ'; // importante: yaw poi pitch
  scene.add(camera);

  // ── Gizmo di posizionamento (TransformControls) ──
  transformControls = new TransformControls(camera, renderer.domElement);
  transformControls.setMode('translate');
  transformControls.setSize(1.1);
  // compat: nelle versioni recenti il gizmo si aggiunge via getHelper()
  scene.add(transformControls.getHelper ? transformControls.getHelper() : transformControls);
  transformControls.addEventListener('dragging-changed', e => {
    gizmoDragging = e.value;
    if (orbitControls) orbitControls.enabled = !e.value; // non ruotare mentre sposti (vista aerea)
    // al RILASCIO (e.value=false) salva la nuova posizione
    if (!e.value && gizmoTarget && gizmoTarget.userData.gizmoName)
      saveObjectPosition(gizmoTarget.userData.gizmoName, gizmoTarget);
  });
  // mentre trascini il gizmo, aggiorna i campi X/Y/Z
  transformControls.addEventListener('objectChange', () => {
    if (gizmoTarget) updateCoordEditorFields(gizmoTarget);
  });
  setupCoordEditor();

  // ── Drag-to-look ──────────────────────────────────────────────────────────
  const canvas = renderer.domElement;

  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (gizmoDragging || (transformControls && transformControls.axis)) return; // gizmo ha priorità
    isDragging = true;
    dragMoved  = false;
    dragPrev   = { x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
  });

  window.addEventListener('mousemove', e => {
    if (gizmoDragging) { isDragging = false; return; }
    if (!isDragging) return;
    const dx = e.clientX - dragPrev.x;
    const dy = e.clientY - dragPrev.y;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    dragPrev = { x: e.clientX, y: e.clientY };

    cameraYaw   -= dx * LOOK_SPEED;
    cameraPitch -= dy * LOOK_SPEED;
    cameraPitch  = Math.max(-1.4, Math.min(1.4, cameraPitch));

    camera.rotation.y = cameraYaw;
    camera.rotation.x = cameraPitch;
  });

  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    canvas.classList.remove('dragging');
    // Se il mouse non si è mosso = click → interagisci
    if (!dragMoved) onInteract();
    isDragging = false;
  });

  // Touch per mobile/visore
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    isDragging = true; dragMoved = false;
    dragPrev = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const t = e.touches[0];
    const dx = t.clientX - dragPrev.x;
    const dy = t.clientY - dragPrev.y;
    dragMoved = true;
    dragPrev = { x: t.clientX, y: t.clientY };
    cameraYaw   -= dx * LOOK_SPEED;
    cameraPitch -= dy * LOOK_SPEED;
    cameraPitch  = Math.max(-1.4, Math.min(1.4, cameraPitch));
    camera.rotation.y = cameraYaw;
    camera.rotation.x = cameraPitch;
  }, { passive: true });

  canvas.addEventListener('touchend', () => {
    if (!dragMoved) onInteract();
    isDragging = false;
  });

  // Movimento tastiera
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    document.getElementById('instructions').style.display = 'none';

    // Salto (Space) — solo in FPS
    if (e.code === 'Space' && cameraMode === 'fps') {
      e.preventDefault();   // evita lo scroll della pagina
      if (jumpCount < MAX_JUMPS) {
        velocityY  = JUMP_FORCE;
        isOnGround = false;
        jumpCount++;
      }
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // WebXR VR
  await setupVR();

  // ── Pulsante Vista Aerea ─────────────────────────────────────────────────
  document.getElementById('btn-overhead').addEventListener('click', toggleOverhead);

  // ── Pulsante Modelli ─────────────────────────────────────────────────────
  document.getElementById('btn-models').addEventListener('click', () => {
    const panel = document.getElementById('models-panel');
    const isVisible = panel.style.display === 'block';
    panel.style.display = isVisible ? 'none' : 'block';
    document.getElementById('btn-models').classList.toggle('active', !isVisible);
  });

  // ── Pulsante Entrata ──────────────────────────────────────────────────────
  document.getElementById('btn-entrance').addEventListener('click', () => {
    const btn = document.getElementById('btn-entrance');
    if (btn.classList.contains('active')) {
      // Secondo click: cancella il punto salvato
      if (confirm('Cancellare il punto d\'entrata salvato?')) {
        localStorage.removeItem(ENTRANCE_KEY);
        btn.classList.remove('active');
        showNotification('🗑 Punto d\'entrata rimosso — si ripartirà dall\'origine');
      }
    } else {
      saveEntrance();
    }
  });
  // Marca il pulsante come attivo se esiste già un punto salvato
  if (loadSavedEntrance()) document.getElementById('btn-entrance').classList.add('active');

  // Carica scena
  await loadScene();

  // Avvia render loop
  renderer.setAnimationLoop(animate);
}

// ─── WebXR ────────────────────────────────────────────────────────────────
async function setupVR() {
  if (!('xr' in navigator)) return;
  const supported = await navigator.xr?.isSessionSupported?.('immersive-vr').catch(() => false);
  if (!supported) return;

  const vrBtn = document.getElementById('vr-btn');
  vrBtn.style.display = 'block';

  // Usa il VRButton ufficiale di Three.js come fallback,
  // ma noi gestiamo il click manualmente per più controllo
  vrBtn.addEventListener('click', async () => {
    if (renderer.xr.isPresenting) {
      await renderer.xr.getSession()?.end();
    } else {
      const session = await navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      });
      renderer.xr.setSession(session);
      vrBtn.textContent = '❌ Esci da VR';
      session.addEventListener('end', () => { vrBtn.textContent = '🥽 Entra in VR'; });
    }
  });

  // Controller VR per interazione
  const controllerFactory = new XRControllerModelFactory();
  for (let i = 0; i < 2; i++) {
    const controller = renderer.xr.getController(i);
    controller.addEventListener('selectstart', onVRInteract);
    scene.add(controller);

    const controllerGrip = renderer.xr.getControllerGrip(i);
    controllerGrip.add(controllerFactory.createControllerModel(controllerGrip));
    scene.add(controllerGrip);

    // Ray pointer
    const geometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -5)
    ]);
    const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x4a9eff, opacity: 0.6, transparent: true }));
    controller.add(line);
  }
}

// ─── Caricamento scena ────────────────────────────────────────────────────
async function loadScene() {
  setProgress(5, 'Lettura dati scena...');

  // Carica scene.json
  try {
    const res = await fetch('./scene.json');
    sceneData = await res.json();
  } catch (e) {
    console.warn('scene.json non trovato, uso dati demo');
    sceneData = getDemoScene();
  }

  // Carica manifest (prima del modello, serve il buildId per la cache)
  // cache-bust con timestamp: il manifest deve essere SEMPRE fresco
  let manifest = null;
  try {
    const res = await fetch('./manifest.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) manifest = await res.json();
  } catch (e) {}
  loadedManifest = manifest;

  // Cache-busting: se il buildId è cambiato, invalida la cache IDB
  if (manifest?.buildId) {
    const storedBuild = localStorage.getItem('sc32-build-id');
    if (storedBuild !== manifest.buildId) {
      await idbDelete('environment.glb').catch(() => {});
      localStorage.setItem('sc32-build-id', manifest.buildId);
      console.log('🔄 Cache invalidata — nuovo build:', manifest.buildId);
    }
  }

  updateQuestUI();

  // Carica le posizioni salvate (servono già al caricamento dei modelli)
  SAVED_POSITIONS = await loadAllSavedPositions();

  // Carica modello — prova GLB cache → GLB file → FBX auto-conversione
  const loaded = await loadModel();
  if (!loaded) {
    console.warn('Nessun modello caricato — creo ambiente placeholder');
    createPlaceholderEnvironment();
  }

  // Camera rimane alla posizione di default (0, 1.7, 0) impostata in init()

  setProgress(85, 'Posizionamento interactable...');
  placeInteractables();

  setProgress(95, 'Posizionamento teleport...');
  placeTeleports();

  // Aggiorna bounding box e pannello modelli
  updateSceneBoundingBox();
  await loadManifestAndUpdatePanel(manifest);

  // Personaggi animati ora da Unity (glTF), non più dal GLB Blender.
  await loadGltfCharacters();

  // Applica punto d'entrata salvato (sovrascrive la posizione default 0,1.7,0)
  applyEntrancePoint();

  setProgress(100, 'Pronto!');
  setTimeout(() => {
    document.getElementById('loader').style.opacity = '0';
    document.getElementById('loader').style.transition = 'opacity .5s';
    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
  }, 400);
}

function loadGLTF(loader, url, onProgress) {
  return new Promise((resolve, reject) => {
    loader.load(url, resolve, e => onProgress(e.loaded / e.total), reject);
  });
}

// ─── Cache IndexedDB ───────────────────────────────────────────────────────
const IDB_NAME = 'spat-model-cache', IDB_STORE = 'glb';

function idbGet(key) {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => {
      const tx = e.target.result.transaction(IDB_STORE, 'readonly');
      const r  = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    };
    req.onerror = () => rej(req.error);
  });
}

function idbSet(key, value) {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => {
      const tx = e.target.result.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => res();
      tx.onerror    = () => rej(tx.error);
    };
    req.onerror = () => rej(req.error);
  });
}

function idbDelete(key) {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => {
      const tx = e.target.result.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => res();
      tx.onerror    = () => rej(tx.error);
    };
    req.onerror = () => rej(req.error);
  });
}

// ─── Carica modello (GLB cache → GLB file → FBX auto) ────────────────────
async function loadModel() {
  const gltfLoader = new GLTFLoader();

  // 1. Prova dalla cache IndexedDB (conversione FBX precedente)
  setProgress(15, 'Controllo cache locale...');
  try {
    const cached = await idbGet('environment.glb');
    if (cached) {
      setProgress(20, 'Caricamento da cache...');
      const url = URL.createObjectURL(new Blob([cached], { type: 'model/gltf-binary' }));
      const gltf = await loadGLTF(gltfLoader, url, p => setProgress(20 + p * 60, `Cache: ${Math.round(p*100)}%`));
      URL.revokeObjectURL(url);
      addModelToScene(gltf);
      setProgress(82, 'Modello caricato dalla cache ✓');
      return true;
    }
  } catch(e) { console.warn('Cache miss:', e.message); }

  // 2. Prova GLB già convertiti (cache-bust con buildId per evitare GLB vecchio)
  const bust = loadedManifest?.buildId ? `?v=${loadedManifest.buildId}` : `?t=${Date.now()}`;
  const glbCandidates = ['models/environment.glb', 'models/construction_scene.glb'];
  for (const path of glbCandidates) {
    try {
      setProgress(20, `Provo ${path}...`);
      const gltf = await loadGLTF(gltfLoader, path + bust, p => setProgress(20 + p * 60, `GLB: ${Math.round(p*100)}%`));
      addModelToScene(gltf);
      return true;
    } catch(e) { /* non trovato, continua */ }
  }

  // 3. Carica FBX direttamente (con auto-conversione e cache)
  const fbxCandidates = sceneData?.models?.map(m => m.localPath?.replace(/\\/g, '/')) || [];
  // Aggiungi fallback noti
  fbxCandidates.push('models/construction_scene.fbx', 'models/landscape.fbx');
  const fbxUnique = [...new Set(fbxCandidates.filter(Boolean))];

  for (const fbxPath of fbxUnique) {
    try {
      setProgress(20, `Caricamento FBX: ${fbxPath}...`);
      const fbxLoader = new FBXLoader();
      const object = await new Promise((resolve, reject) => {
        fbxLoader.load(
          fbxPath,
          resolve,
          e => { if (e.total) setProgress(20 + (e.loaded/e.total) * 40, `FBX: ${Math.round(e.loaded/e.total*100)}%`); },
          reject
        );
      });

      setProgress(62, 'FBX caricato — conversione in GLB...');
      addFBXToScene(object);

      // Converti e salva in cache in background (non blocca il rendering)
      convertAndCache(object).catch(e => console.warn('Cache write fallita:', e.message));

      return true;
    } catch(e) {
      console.log(`${fbxPath} non caricato:`, e.message);
    }
  }

  return false;
}

function addModelToScene(gltf, label) {
  scene.add(gltf.scene);
  let meshCount = 0;
  gltf.scene.traverse(child => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; meshCount++; }
  });
  if (gltf.animations.length > 0) {
    const mixer = new THREE.AnimationMixer(gltf.scene);
    animationMixers.push({ mixer, clips: gltf.animations });
    // Animazioni spente di default
  }
  // Applica le posizioni degli NPC in Three.js
  applyNPCTransforms(gltf.scene);

  // Registra i root statici (TERRITORIO_root, construction_scene_root) come
  // posizionabili col gizmo + applica eventuali posizioni salvate
  environmentScene = gltf.scene;
  if (loadedManifest?.pieces) {
    for (const piece of loadedManifest.pieces) {
      const root = gltf.scene.getObjectByName(piece.name + '_root');
      if (root) { applySavedToObject(root, piece.name); staticRoots[piece.name] = root; }
    }
  }
  registerModel(label || 'environment.glb', meshCount, gltf.animations.length);
}

// ─── Posizionamento NPC da manifest ──────────────────────────────────────────
function applyNPCTransforms(sceneRoot) {
  if (!loadedManifest?.pieces) return;
  for (const piece of loadedManifest.pieces) {
    if (!piece.position) continue;
    const [px, py, pz] = piece.position;

    const rootName = piece.name + '_root';
    const obj = sceneRoot.getObjectByName(rootName);
    if (obj) {
      // Mapping Unity → Three.js: TX=-UX, TY=UY, TZ=-UZ
      // (asse Z invertito per conversione left→right handed)
      obj.position.set(-px, py, -pz);
      console.log(`✅ ${piece.name} → Three.js(${(-px).toFixed(2)}, ${py.toFixed(2)}, ${(-pz).toFixed(2)}) scale(${obj.scale.toArray().map(v=>v.toFixed(3)).join(',')})`);
    } else {
      console.warn(`⚠️  Root non trovato: "${rootName}" — oggetti disponibili nella scena:`);
      // Stampa i nomi dei figli diretti per debug
      sceneRoot.children.slice(0, 20).forEach(c => console.log('  •', c.name));
    }
  }
}

function addFBXToScene(object, label) {
  scene.add(object);
  let meshCount = 0;
  object.traverse(child => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; meshCount++; }
  });
  if (object.animations?.length > 0) {
    const mixer = new THREE.AnimationMixer(object);
    animationMixers.push({ mixer, clips: object.animations });
    // Animazioni spente di default — si attivano solo via interactable
  }
  registerModel(label || 'fbx', meshCount, object.animations?.length || 0);
}

function registerModel(name, meshCount, animCount) {
  const color = MODEL_COLORS[loadedModels.length % MODEL_COLORS.length];
  loadedModels.push({ name, meshCount, animCount, color });
  // Non aggiornare subito — il manifest sovrascriverà
}

async function loadManifestAndUpdatePanel(preloadedManifest) {
  const list = document.getElementById('models-list');
  list.innerHTML = '';

  // Legenda fissa
  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex;gap:10px;margin-bottom:8px;font-size:.7rem;opacity:.55;flex-wrap:wrap;';
  legend.innerHTML = `
    <span><span style="color:#4a9eff">●</span> Animato</span>
    <span><span style="color:#4aff8a">●</span> Statico</span>
    <span><span style="color:#888">●</span> Altro</span>
  `;
  list.appendChild(legend);

  // Usa manifest già caricato, altrimenti rifetch
  let manifest = preloadedManifest;
  if (!manifest) {
    try {
      const res = await fetch('./manifest.json');
      if (res.ok) manifest = await res.json();
    } catch(e) {}
  }

  if (manifest?.pieces) {
    const header = document.createElement('div');
    header.style.cssText = 'font-size:.72rem;opacity:.4;margin-bottom:8px;';
    header.textContent = `${manifest.sizeMB} MB · ${manifest.pieces.length} pezzi`;
    list.appendChild(header);

    manifest.pieces.forEach(piece => {
      const color = piece.type === 'animated' ? '#4a9eff'
                  : piece.type === 'static'   ? '#4aff8a'
                  : '#888';
      const item = document.createElement('div');
      item.className = 'model-item';

      const dot  = `<div class="model-dot" style="background:${color}"></div>`;
      const name = `<span class="model-name">${piece.name}</span>`;
      const info = `<span class="model-info">${piece.objects} obj</span>`;

      if (piece.type === 'animated' && piece.clips?.length) {
        const clipsJson = JSON.stringify(piece.clips).replace(/'/g, '&#39;');
        const posLabel = piece.position
          ? `<span style="font-size:.65rem;opacity:.45;font-family:monospace;margin-left:2px">(${piece.position.map(v=>v.toFixed(1)).join(', ')})</span>`
          : '';
        const gotoBtn = piece.position
          ? `<button class="goto-btn" data-pos='${JSON.stringify(piece.position)}'>🎯</button>`
          : '';
        item.innerHTML = `${dot}${name}${posLabel}
          ${gotoBtn}
          <button class="play-btn" data-clips='${clipsJson}'>▶</button>
          ${info}`;

        // Teleport al modello
        item.querySelector('.goto-btn')?.addEventListener('click', e => {
          e.stopPropagation();
          const pos = JSON.parse(e.currentTarget.dataset.pos);
          // Passa al modo FPS se in overhead
          if (cameraMode !== 'fps') toggleOverhead();
          // Stessa conversione Unity→Three.js: TX=-UX, TY=UY, TZ=-UZ
          camera.position.set(-pos[0], pos[1] + 1.7, -pos[2] + 4);
          cameraYaw = 0; // guarda in -Z verso il modello
          cameraPitch = 0;
          camera.rotation.y = cameraYaw;
          camera.rotation.x = cameraPitch;
          showNotification(`📍 ${piece.name}`);
        });

        item.querySelector('.play-btn').addEventListener('click', e => {
          e.stopPropagation();
          const btn = e.currentTarget;
          const clips = JSON.parse(btn.dataset.clips);
          if (btn.classList.contains('playing')) {
            stopAllAnimations();
            document.querySelectorAll('.play-btn').forEach(b => {
              b.classList.remove('playing'); b.textContent = '▶';
            });
          } else {
            document.querySelectorAll('.play-btn').forEach(b => {
              b.classList.remove('playing'); b.textContent = '▶';
            });
            playClipsForModel(clips);
            btn.classList.add('playing');
            btn.textContent = '⏹';
          }
        });
      } else {
        const root = staticRoots[piece.name];
        const btns = root
          ? `<button class="gizmo-btn"   title="Sposta col gizmo">✥</button>`
            + `<button class="confirm-btn" title="Conferma e salva">✓</button>`
            + `<button class="delete-btn"  title="Nascondi dalla scena">🗑</button>`
          : '';
        item.innerHTML = `${dot}${name}${btns}${info}`;
        if (root) {
          wireGizmoControls(item, piece.name, root);
          item.querySelector('.delete-btn')?.addEventListener('click', e => {
            e.stopPropagation();
            if (gizmoTarget === root) { transformControls.detach(); gizmoTarget = null; hideCoordEditor(); }
            root.visible = !root.visible;
            const db = e.currentTarget;
            db.textContent = root.visible ? '🗑' : '👁';
            db.title = root.visible ? 'Nascondi dalla scena' : 'Mostra nella scena';
            db.style.color = root.visible ? '' : '#aaa';
            showNotification(root.visible ? `👁 ${piece.name} visibile` : `🙈 ${piece.name} nascosto`);
          });
        }
      }
      list.appendChild(item);
    });
  } else {
    // Fallback: mostra quello che è stato registrato
    for (const m of loadedModels) {
      const item = document.createElement('div');
      item.className = 'model-item';
      item.innerHTML = `
        <div class="model-dot" style="background:${m.color}"></div>
        <span class="model-name">${m.name}</span>
        <span class="model-info">${m.meshCount} mesh</span>
      `;
      list.appendChild(item);
    }
  }
}

// ─── Play / Stop animazioni per modello ──────────────────────────────────────
function stopAllAnimations() {
  for (const { mixer } of animationMixers) mixer.stopAllAction();
}

function playClipsForModel(clipNames) {
  stopAllAnimations();
  let played = 0;
  for (const { mixer, clips } of animationMixers) {
    for (const name of clipNames) {
      const clip = THREE.AnimationClip.findByName(clips, name);
      if (clip) { mixer.clipAction(clip).reset().play(); played++; }
    }
  }
  console.log(`▶️ ${played} clip avviate:`, clipNames);
}

// ─── Auto-play: mette ogni personaggio nella sua posa d'azione (come Unity) ──
// La posa REST/bind non è quella di Unity: i personaggi vanno messi sul loro
// frame d'animazione. Avviamo la prima clip di ogni modello animato.
function autoPlayActionPoses() {
  if (!loadedManifest?.pieces) return;
  let n = 0;
  for (const piece of loadedManifest.pieces) {
    if (piece.type !== 'animated' || !piece.clips?.length) continue;
    const clipName = piece.clips[0];
    for (const { mixer, clips } of animationMixers) {
      const clip = THREE.AnimationClip.findByName(clips, clipName);
      if (clip) {
        const action = mixer.clipAction(clip);
        action.reset();
        action.setLoop(THREE.LoopRepeat);
        action.play();
        n++;
      }
    }
  }
  console.log(`🎬 Auto-play: ${n} animazioni avviate (posa d'azione)`);
}

// ─── Personaggi Unity (glTF da UnityGLTF) ────────────────────────────────────
// I personaggi animati vengono esportati da Unity in glTF (skinning+anim intatti)
// e caricati qui sopra la scena statica. Niente più Blender per i personaggi.
// Lista fissa di fallback (se l'autodiscovery non funziona)
const CHARACTER_GLTFS = [
  'models/gltfModels/Axe_Wield_01_FINAL2.gltf',
  'models/gltfModels/Environment.gltf',                       // i 3 Hammering
  'models/gltfModels/rischio da macchinari in movimento.gltf', // escavatore + infortunato
  'models/gltfModels/rischio eletrico.gltf',                  // rischio elettrico
  'models/gltfModels/Spade_02_FINAL2.gltf',
  'models/gltfModels/sliping.gltf',
  'models/gltfModels/falling from loosing balance.gltf',
];

// Scopre da solo tutti i .gltf nella cartella (legge la directory listing del server)
async function discoverCharacterGltfs() {
  try {
    const res = await fetch('models/gltfModels/');
    if (!res.ok) return [];
    const html = await res.text();
    const found = [...html.matchAll(/href="([^"]+\.gltf)"/gi)]
      .map(m => 'models/gltfModels/' + decodeURIComponent(m[1].split(/[\\/]/).pop()));
    return [...new Set(found)];
  } catch { return []; }
}
// UnityGLTF nega solo X; la scena statica Blender nega X e Z → riallineo il Z.
let CHAR_FLIP_Z = true;

const gltfCharacters = [];   // {name, root, action}

async function loadGltfCharacters() {
  const loader = new GLTFLoader();
  // unisci lista fissa + autodiscovery (così i nuovi file compaiono da soli)
  const discovered = await discoverCharacterGltfs();
  const fileList = [...new Set([...CHARACTER_GLTFS, ...discovered])];
  console.log(`📂 glTF personaggi da caricare (${fileList.length}):`, fileList);

  for (const url of fileList) {
    try {
      const gltf = await new Promise((res, rej) =>
        loader.load(encodeURI(url) + '?v=' + Date.now(), res, undefined, rej));
      gltf.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

      const chars = gltf.scene.children.slice();   // root personaggi (top-level)
      const anims = gltf.animations || [];
      // un mixer per file (binding glTF corretto), una clip per personaggio (per indice)
      const mixer = anims.length ? new THREE.AnimationMixer(gltf.scene) : null;
      chars.forEach((charRoot, i) => {
        if (CHAR_FLIP_Z) charRoot.position.z = -charRoot.position.z;
        // posizione salvata col gizmo ha la precedenza (+ imposta gizmoName)
        const saved = SAVED_POSITIONS[charRoot.name];
        applySavedToObject(charRoot, charRoot.name);

        let action = null;
        const clip = anims[i] || null;
        if (clip && mixer) {
          action = mixer.clipAction(clip);
          action.reset(); action.setLoop(THREE.LoopRepeat); action.play();
        }
        gltfCharacters.push({ name: charRoot.name, root: charRoot, action });
        const p = charRoot.position;
        console.log(`🧍 ${charRoot.name} @ (${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})${saved?' [salvata]':''}`);
      });
      if (mixer) animationMixers.push({ mixer, clips: anims });
      scene.add(gltf.scene);
    } catch (e) {
      console.warn(`Personaggio non caricato: ${url}`, e);
    }
  }
  console.log(`✅ Personaggi Unity caricati: ${gltfCharacters.length}`);
  addCharactersToPanel();
}

// Aggancia/sgancia il gizmo di posizionamento a un personaggio
function toggleGizmo(charRoot, btn) {
  if (gizmoTarget === charRoot) {
    transformControls.detach();
    gizmoTarget = null;
    document.querySelectorAll('.gizmo-btn').forEach(b => b.classList.remove('active'));
    hideCoordEditor();
    showNotification('Gizmo disattivato');
  } else {
    transformControls.attach(charRoot);
    gizmoTarget = charRoot;
    document.querySelectorAll('.gizmo-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    showCoordEditor(charRoot, charRoot.userData.gizmoName);
    showNotification(`✥ Sposta: ${charRoot.userData.gizmoName} — frecce o coordinate manuali`);
  }
}

// ─── Editor coordinate manuale ───────────────────────────────────────────────
function updateCoordEditorFields(obj) {
  document.getElementById('ce-x').value = obj.position.x.toFixed(2);
  document.getElementById('ce-y').value = obj.position.y.toFixed(2);
  document.getElementById('ce-z').value = obj.position.z.toFixed(2);
}
function showCoordEditor(obj, name) {
  document.getElementById('ce-name').textContent = name || 'oggetto';
  updateCoordEditorFields(obj);
  document.getElementById('coord-editor').style.display = 'block';
}
function hideCoordEditor() { document.getElementById('coord-editor').style.display = 'none'; }
function applyCoordEditor() {
  if (!gizmoTarget) return;
  const x = parseFloat(document.getElementById('ce-x').value);
  const y = parseFloat(document.getElementById('ce-y').value);
  const z = parseFloat(document.getElementById('ce-z').value);
  if ([x, y, z].some(v => Number.isNaN(v))) { showNotification('Coordinate non valide'); return; }
  gizmoTarget.position.set(x, y, z);
  if (gizmoTarget.userData.gizmoName) saveObjectPosition(gizmoTarget.userData.gizmoName, gizmoTarget);
}
function setupCoordEditor() {
  ['ce-x', 'ce-y', 'ce-z'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyCoordEditor));
  document.getElementById('ce-apply').addEventListener('click', applyCoordEditor);
  document.getElementById('ce-close').addEventListener('click', () => {
    if (gizmoTarget) toggleGizmo(gizmoTarget, null);
  });
  // "Porta davanti a me": utile per oggetti lontanissimi (es. Z 39780)
  document.getElementById('ce-here').addEventListener('click', () => {
    if (!gizmoTarget) return;
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const p = camera.position.clone().add(fwd.multiplyScalar(5));
    gizmoTarget.position.set(p.x, 0, p.z);   // a terra, 5m davanti
    updateCoordEditorFields(gizmoTarget);
    if (gizmoTarget.userData.gizmoName) saveObjectPosition(gizmoTarget.userData.gizmoName, gizmoTarget);
    showNotification('Portato davanti alla camera');
  });
}

// Esporta tutte le posizioni salvate come file positions.json
function exportPositions() {
  const data = { ...SAVED_POSITIONS, ...loadSavedPositions() };
  if (!Object.keys(data).length) { showNotification('Nessuna posizione salvata'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'positions.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showNotification('📥 positions.json scaricato');
}

// Aggiunge i personaggi al pannello "Modelli" con 🎯 goto e ▶/⏹ pausa
function addCharactersToPanel() {
  const list = document.getElementById('models-list');
  if (!list || !gltfCharacters.length) return;

  const header = document.createElement('div');
  header.style.cssText = 'font-size:.72rem;color:#4a9eff;margin:12px 0 6px;'
    + 'text-transform:uppercase;letter-spacing:.05em;font-weight:600;';
  header.textContent = `🧍 Personaggi (${gltfCharacters.length})`;
  list.appendChild(header);

  const exp = document.createElement('button');
  exp.textContent = '💾 Esporta posizioni';
  exp.style.cssText = 'background:rgba(74,158,255,.2);border:1px solid rgba(74,158,255,.4);'
    + 'color:#9ccfff;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:.72rem;'
    + 'margin-bottom:8px;width:100%;';
  exp.addEventListener('click', e => { e.stopPropagation(); exportPositions(); });
  list.appendChild(exp);

  for (const ch of gltfCharacters) {
    const item = document.createElement('div');
    item.className = 'model-item';
    item.innerHTML =
      `<div class="model-dot" style="background:#4a9eff"></div>`
      + `<span class="model-name">${ch.name}</span>`
      + `<button class="goto-btn"    title="Vai al personaggio">🎯</button>`
      + `<button class="gizmo-btn"   title="Sposta col gizmo">✥</button>`
      + `<button class="confirm-btn" title="Conferma e salva posizione">✓</button>`
      + (ch.action ? `<button class="play-btn playing" title="Pausa/Riprendi">⏹</button>` : '')
      + `<button class="delete-btn"  title="Rimuovi dalla scena">🗑</button>`;

    item.querySelector('.goto-btn').addEventListener('click', e => {
      e.stopPropagation();
      if (cameraMode !== 'fps') toggleOverhead();
      const p = ch.root.getWorldPosition(new THREE.Vector3());
      camera.position.set(p.x, p.y + 1.7, p.z + 4);
      cameraYaw = 0; cameraPitch = 0;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = 0; camera.rotation.x = 0;
      showNotification(`📍 ${ch.name}`);
    });

    const gb = item.querySelector('.gizmo-btn');
    gb.addEventListener('click', e => { e.stopPropagation(); toggleGizmo(ch.root, gb); });

    item.querySelector('.confirm-btn').addEventListener('click', e => {
      e.stopPropagation();
      saveObjectPosition(ch.name, ch.root);
      if (gizmoTarget === ch.root) toggleGizmo(ch.root, gb);
    });

    const pb = item.querySelector('.play-btn');
    if (pb) pb.addEventListener('click', e => {
      e.stopPropagation();
      ch.action.paused = !ch.action.paused;
      pb.classList.toggle('playing', !ch.action.paused);
      pb.textContent = ch.action.paused ? '▶' : '⏹';
    });

    item.querySelector('.delete-btn').addEventListener('click', e => {
      e.stopPropagation();
      // Stacca il gizmo se agganciato
      if (gizmoTarget === ch.root) { transformControls.detach(); gizmoTarget = null; hideCoordEditor(); }
      // Ferma l'animazione
      if (ch.action) ch.action.stop();
      // Rimuovi dalla scena
      if (ch.root.parent) ch.root.parent.remove(ch.root);
      // Rimuovi dall'array
      const idx = gltfCharacters.indexOf(ch);
      if (idx !== -1) gltfCharacters.splice(idx, 1);
      // Rimuovi la riga dal pannello
      item.remove();
      // Aggiorna contatore header
      header.textContent = `🧍 Personaggi (${gltfCharacters.length})`;
      showNotification(`🗑 ${ch.name} rimosso dalla scena`);
    });

    list.appendChild(item);
  }
}

// ─── Centro utile della scena (usato da vista aerea) ─────────────────────
function getSceneActionCenter() {
  const all = sceneData?.interactables || [];
  const ground = all.filter(ia => ia.position.y < 10);
  const arr = ground.length ? ground : all;
  if (!arr.length) return new THREE.Vector3(0, 2, 20);
  return new THREE.Vector3(
    arr.reduce((s, ia) => s + ia.position.x, 0) / arr.length,
    arr.reduce((s, ia) => s + ia.position.y, 0) / arr.length,
    arr.reduce((s, ia) => s + ia.position.z, 0) / arr.length
  );
}

// ─── Vista Aerea (Orbit stile Blender) ────────────────────────────────────
function updateSceneBoundingBox() {
  const box = new THREE.Box3();
  scene.traverse(obj => {
    if (obj.isMesh) box.expandByObject(obj);
  });
  if (!box.isEmpty()) sceneBoundingBox = box;
}

function toggleOverhead() {
  const btn = document.getElementById('btn-overhead');
  const canvas = renderer.domElement;

  if (cameraMode === 'fps') {
    fpsCameraState.pos.copy(camera.position);
    fpsCameraState.yaw   = cameraYaw;
    fpsCameraState.pitch = cameraPitch;

    // Usa il centro degli interactable come target (ignora bounding box del territorio)
    const center = getSceneActionCenter();
    const maxDim = 80;   // dimensione approssimativa del cantiere in unità world

    orbitControls = new OrbitControls(camera, canvas);
    orbitControls.target.copy(center);
    orbitControls.enableDamping      = true;
    orbitControls.dampingFactor      = 0.06;
    orbitControls.screenSpacePanning = true;
    orbitControls.minDistance = 2;
    orbitControls.maxDistance = maxDim * 4;
    orbitControls.mouseButtons = {
      LEFT:   THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT:  THREE.MOUSE.PAN
    };

    // Vista dall'alto leggermente inclinata
    const dist = maxDim * 0.9;
    camera.position.set(
      center.x,
      center.y + dist * 0.7,
      center.z + dist * 0.7
    );
    orbitControls.update();

    canvas.style.cursor = 'default';
    cameraMode = 'overhead';
    btn.classList.add('active');
    btn.textContent = '🎮 Vista FPS';
    document.getElementById('crosshair').style.display = 'none';
  } else {
    if (orbitControls) { orbitControls.dispose(); orbitControls = null; }
    camera.position.copy(fpsCameraState.pos);
    cameraYaw   = fpsCameraState.yaw;
    cameraPitch = fpsCameraState.pitch;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = cameraYaw;
    camera.rotation.x = cameraPitch;

    canvas.style.cursor = 'grab';
    cameraMode = 'fps';
    btn.classList.remove('active');
    btn.textContent = '🗺️ Vista aerea';
    document.getElementById('crosshair').style.display = '';
  }
}

async function convertAndCache(object) {
  return new Promise((resolve, reject) => {
    const exporter = new GLTFExporter();
    exporter.parse(
      object,
      async (glb) => {
        try {
          await idbSet('environment.glb', glb);
          console.log(`✅ GLB salvato in cache (${(glb.byteLength/1024/1024).toFixed(1)} MB) — ricarica più veloce`);
          resolve();
        } catch(e) { reject(e); }
      },
      reject,
      { binary: true, animations: object.animations || [] }
    );
  });
}

// ─── Interactable hotspot ─────────────────────────────────────────────────
function placeInteractables() {
  if (!sceneData?.interactables) return;

  const geo = new THREE.SphereGeometry(0.3, 8, 8);

  for (const data of sceneData.interactables) {
    // Sfera invisibile come collider
    const mesh = new THREE.Mesh(
      geo,
      new THREE.MeshBasicMaterial({ visible: false })
    );
    mesh.position.set(data.position.x, data.position.y, data.position.z);
    mesh.userData = { interactable: data };
    scene.add(mesh);
    interactableMeshes.push(mesh);

    // Marker visivo (cerchio flottante)
    addHotspotMarker(data.position, data.interactText);
  }
}

function addHotspotMarker(pos, label) {
  // Sprite cerchio
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Cerchio esterno
  ctx.beginPath();
  ctx.arc(128, 128, 100, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 8;
  ctx.stroke();

  // Icona mano
  ctx.font = 'bold 90px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✋', 128, 128);

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
  sprite.position.set(pos.x, pos.y + 1.2, pos.z);
  sprite.scale.set(0.8, 0.8, 0.8);
  sprite.userData = { isMarker: true, baseY: pos.y + 1.2 };
  scene.add(sprite);
}

function placeTeleports() {
  if (!sceneData?.teleports?.length) return;

  const panel = document.getElementById('teleport-panel');
  for (const tp of sceneData.teleports) {
    const btn = document.createElement('button');
    btn.className = 'tp-btn';
    btn.textContent = `⬡ ${tp.name || 'Teleport'}`;
    btn.addEventListener('click', () => teleportTo(tp.position));
    panel.appendChild(btn);
  }
}

function teleportTo(pos) {
  camera.position.set(pos.x, pos.y + 1.7, pos.z);
  showNotification(`Teletrasportato: ${pos.x.toFixed(1)}, ${pos.z.toFixed(1)}`);
}

// ─── Interazione ──────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
let currentInteractable = null;

function checkInteractables() {
  // Interactable temporaneamente disattivati (posizioni NPC non ancora verificate)
  hideInteractPanel();
  currentInteractable = null;
}

function onInteract() {
  if (!currentInteractable || cameraMode !== 'fps') return;
  triggerInteractable(currentInteractable);
}

function onVRInteract() {
  if (currentInteractable) triggerInteractable(currentInteractable);
}

function triggerInteractable(data) {
  showNotification(data.interactText);
  questCompleted.add(data.id);
  updateQuestUI();

  // Esegui azioni
  for (const action of (data.onInteract || [])) {
    if (action.method === 'Play' && action.stringArg) {
      playAnimation(action.stringArg);
    } else if (action.method === 'SetActive') {
      // Prova a trovare l'oggetto per nome nella scena Three.js
      const obj = scene.getObjectByName(action.stringArg);
      if (obj) obj.visible = action.boolArg;
    }
  }
}

function playAnimation(clipName) {
  for (const { mixer, clips } of animationMixers) {
    // Cerca match esatto oppure con prefisso modello (es. "Spade_01|clipName")
    const clip = clips.find(c => c.name === clipName || c.name.endsWith('|' + clipName));
    if (clip) {
      const action = mixer.clipAction(clip);
      action.reset().play();
      console.log(`▶️  Animazione: ${clip.name}`);
      return;
    }
  }
  console.log(`⚠️  Clip non trovata: ${clipName}`);
}

function showInteractPanel(text) {
  const panel = document.getElementById('interact-panel');
  document.getElementById('interact-label').textContent = text;

function updateQuestUI() {

// ─── Animazione markers (floating) ───────────────────────────────────────
function animateMarkers(t) {
  scene.traverse(obj => {
    if (obj.isSprite && obj.userData.isMarker) {
      obj.position.y = obj.userData.baseY + Math.sin(t * 1.5) * 0.08;
    }
  });
}

// ─── Loop principale ──────────────────────────────────────────────────────
function animate(timestamp, frame) {
  const delta = clock.getDelta();
  const t = clock.getElapsedTime();

  // OrbitControls (vista aerea)
  if (cameraMode === 'overhead' && orbitControls) {
    orbitControls.update();
  }

  // Movimento WASD + Shift sprint — solo in modalità FPS
  if (!renderer.xr.isPresenting && cameraMode === 'fps') {
    const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
    const speed = MOVE_SPEED * (isSprinting ? SPRINT_MULTIPLIER : 1);

    moveDir.set(0, 0, 0);
    if (keys['KeyW'] || keys['ArrowUp'])    moveDir.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  moveDir.z += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  moveDir.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

    if (moveDir.length() > 0) {
      moveDir.normalize().multiplyScalar(speed * delta);
      // Vettori forward/right dal yaw (ignora pitch per il movimento orizzontale)
      fwdVec.set(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
      rightVec.set(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
      camera.position.addScaledVector(fwdVec,   moveDir.z);
      camera.position.addScaledVector(rightVec, moveDir.x);
    }

    // ── Gravità e salto ───────────────────────────────────────────────────
    if (isOnGround) {
      // Traccia il livello del suolo dalla posizione corrente (segue rampe/scale)
      playerGroundY = camera.position.y;
    } else {
      // Applica gravità
      velocityY += GRAVITY * delta;
      camera.position.y += velocityY * delta;
      // Atterraggio: torna al livello del suolo
      if (camera.position.y <= playerGroundY) {
        camera.position.y = playerGroundY;
        velocityY  = 0;
        isOnGround = true;
        jumpCount  = 0;
      }
    }
  }

  // Aggiorna animatori
  for (const { mixer } of animationMixers) {
    mixer.update(delta);
  }

  // Controlla interactable a ogni frame
  checkInteractables();

  // Aggiorna HUD coordinate camera
  const hud = document.getElementById('cam-hud');
  if (hud) {
    const p = camera.position;
    hud.textContent = `X ${p.x.toFixed(1)}  Y ${p.y.toFixed(1)}  Z ${p.z.toFixed(1)}`;
  }

  // Anima markers
  animateMarkers(t);

  renderer.render(scene, camera);
}
