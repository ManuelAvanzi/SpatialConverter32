<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MetaReality — Redazione</title>
<script>
  // Tema prima del paint (niente flash): salvato, altrimenti preferenza di sistema
  document.documentElement.dataset.theme =
    localStorage.getItem('sc-admin-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
  :root {
    --accent:#f97316; --accent-hover:#e8650a; --accent-soft:rgba(249,115,22,.1);
    --bg:#f6f3ee; --panel:#ffffff; --sidebar:#fbf9f5;
    --text:#1f1b16; --muted:#8a8178; --line:#e8e2d8;
    --green:#1fa455; --green-soft:rgba(31,164,85,.12);
    --amber:#b97f10; --amber-soft:rgba(212,150,30,.15);
    --danger:#d94343; --danger-soft:rgba(217,67,67,.09);
    --thumb-bg:#ece7df;
    --shadow:0 1px 3px rgba(28,20,10,.05), 0 6px 18px rgba(28,20,10,.05);
  }
  html[data-theme="dark"] {
    --accent-soft:rgba(249,115,22,.15);
    --bg:#0b0e16; --panel:#121624; --sidebar:#0e1220;
    --text:#e7eaf2; --muted:#8e96ab; --line:#262d40;
    --green:#3ecf7a; --green-soft:rgba(62,207,122,.13);
    --amber:#ffb84a; --amber-soft:rgba(255,184,74,.13);
    --danger:#ff7a6a; --danger-soft:rgba(255,122,106,.11);
    --thumb-bg:#080b12;
    --shadow:0 1px 3px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.25);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; transition:background .2s, color .2s; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--text);
    border-radius:9px; padding:8px 14px; cursor:pointer; font-size:.85rem; font-family:inherit;
    transition:border-color .15s, color .15s, background .15s;
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1; white-space:nowrap; }
  .btn svg { width:14px; height:14px; flex-shrink:0; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:#fff; }
  .btn.ghost { background:transparent; }
  .btn.accent { background:var(--accent-soft); border-color:rgba(249,115,22,.4); color:var(--accent); font-weight:600; }
  .btn.accent:hover { border-color:var(--accent); }
  .btn.green { background:var(--green-soft); border-color:transparent; color:var(--green); }
  .btn.green:hover { border-color:var(--green); }
  .btn.red { background:var(--danger-soft); border-color:transparent; color:var(--danger); }
  .btn.red:hover { border-color:var(--danger); }
  .btn.sm { padding:7px 8px; font-size:.78rem; }

  /* LOGIN */
  #login { max-width:360px; margin:13vh auto; text-align:center; padding:0 20px; }
  #login .logo { font-size:1.6rem; font-weight:800; margin-bottom:22px; }
  #login .logo span { color:var(--accent); }
  #login h2 { font-size:1.15rem; margin-bottom:6px; }
  #login p { font-size:.84rem; color:var(--muted); margin-bottom:20px; }
  #login input { width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--text); border-radius:10px; padding:12px 14px; font-size:1rem; margin-bottom:12px; }
  #login input:focus { outline:none; border-color:var(--accent); }
  #login .btn { width:100%; padding:12px; justify-content:center; }
  #login .err { color:var(--danger); font-size:.8rem; min-height:1.2em; margin-top:10px; }

  /* SHELL */
  .app-shell { display:flex; min-height:100vh; }
  .sidebar { width:228px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; }
  .sidebar .logo { font-size:1.18rem; font-weight:800; margin-bottom:28px; letter-spacing:-.01em; }
  .sidebar .logo span { color:var(--accent); }
  .sidebar nav { flex:1; }
  .nav-item { display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:10px;
    color:var(--muted); text-decoration:none; font-size:.88rem; font-weight:600; }
  .nav-item svg { width:16px; height:16px; }
  .nav-item.active { background:var(--panel); color:var(--text); border:1px solid var(--line); box-shadow:var(--shadow); }
  .nav-item.active svg { color:var(--accent); }
  .sidebar .user { border-top:1px solid var(--line); padding-top:14px; display:flex; align-items:center; gap:8px; }
  .sidebar .user .role { font-size:.78rem; color:var(--muted); flex:1; }

  .main { flex:1; min-width:0; padding:28px 36px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .topbar h1 { font-size:1.5rem; letter-spacing:-.02em; }
  .topbar p { font-size:.82rem; color:var(--muted); margin-top:3px; }
  .topbar-actions { display:flex; align-items:center; gap:9px; flex-shrink:0; }
  #themeBtn { border:none; background:none; padding:6px; border-radius:8px; cursor:pointer;
    color:var(--muted); opacity:.7; display:inline-flex; transition:all .15s; }
  #themeBtn:hover { opacity:1; color:var(--accent); background:var(--accent-soft); }
  #themeBtn svg { width:16px; height:16px; }

  .searchbar { margin-bottom:16px; position:relative; max-width:520px; }
  .searchbar .ico { position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--muted); pointer-events:none; display:flex; }
  .searchbar .ico svg { width:15px; height:15px; }
  .searchbar input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:11px 14px 11px 38px; font-size:.9rem; box-shadow:var(--shadow); }
  .searchbar input:focus { outline:none; border-color:var(--accent); }
  .searchbar input::placeholder { color:var(--muted); }

  .filter-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .filter-label { font-size:.76rem; color:var(--muted); margin-right:2px; }
  .filter-chip { border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:5px 13px; cursor:pointer; font-size:.76rem; font-weight:600;
    font-family:inherit; transition:all .15s; }
  .filter-chip:hover { color:var(--accent); border-color:var(--accent); }
  .filter-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px;
    display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:cardIn .42s cubic-bezier(.2,.7,.3,1) backwards; }
  .card:hover { transform:translateY(-4px); border-color:var(--accent);
    box-shadow:0 10px 28px rgba(28,20,10,.14), 0 2px 6px rgba(28,20,10,.08); }
  @keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation:none; } .card:hover { transform:none; } }
  .card .thumb { height:198px; border-radius:15px 15px 0 0; background-size:cover; background-position:center;
    margin:-16px -16px 4px; background-color:var(--thumb-bg); }
  .card .thumb.ph { display:flex; align-items:center; justify-content:center; color:var(--muted); opacity:.5; }
  .card .thumb.ph svg { width:44px; height:44px; stroke-width:1.4; }
  .card .top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card .name { font-size:1rem; font-weight:700; letter-spacing:-.01em; }
  .card .meta { font-size:.72rem; color:var(--muted); margin-top:3px; }
  .status { font-size:.64rem; font-weight:800; padding:4px 9px; border-radius:999px; text-transform:uppercase;
    letter-spacing:.05em; flex-shrink:0; display:inline-flex; align-items:center; gap:5px; }
  .status::before { content:''; width:6px; height:6px; border-radius:50%; }
  .status.published { background:var(--green-soft); color:var(--green); }
  .status.published::before { background:var(--green); }
  .status.draft { background:var(--amber-soft); color:var(--amber); }
  .status.draft::before { background:var(--amber); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; min-height:4px; }
  .tag { font-size:.7rem; color:var(--muted); background:var(--bg); border:1px solid var(--line);
    border-radius:7px; padding:2px 9px; }
  .card .actions { display:grid; gap:7px; }
  /* Le azioni si ancorano al fondo: bottoni alla stessa altezza in tutte le card
     della riga, qualunque sia la lunghezza di titolo e tag */
  .card .actions.first { grid-template-columns:1fr 1fr; border-top:1px solid var(--line); padding-top:12px; margin-top:auto; }
  .card .actions.mid { grid-template-columns:repeat(3, 1fr); }
  .card .actions.last { grid-template-columns:1fr auto; }
  .card .actions.last .btn.red { padding:7px 12px; }
  .empty { color:var(--muted); text-align:center; padding:50px; grid-column:1/-1; }
  .cover-edit { display:flex; gap:10px; align-items:flex-start; }
  .cover-prev { width:96px; height:54px; border-radius:7px; background:var(--thumb-bg) center/cover no-repeat;
    border:1px solid var(--line); flex-shrink:0; }
  .cover-controls { flex:1; display:flex; flex-direction:column; gap:7px; }
  .cover-controls .btn { justify-content:center; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(20,14,8,.45); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.show { display:flex; }
  .modal-box { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; width:420px; max-width:92vw; box-shadow:var(--shadow); }
  .modal-title { font-size:1.05rem; font-weight:700; margin-bottom:16px; }
  .modal-box label { display:block; font-size:.76rem; color:var(--muted); margin:12px 0 5px; }
  .modal-box input { width:100%; background:var(--bg); border:1px solid var(--line);
    color:var(--text); border-radius:9px; padding:9px 12px; font-size:.9rem; font-family:inherit; }
  .modal-box input:focus { outline:none; border-color:var(--accent); }
  .modal-actions { display:flex; gap:9px; margin-top:20px; }
  .modal-actions .btn { flex:1; justify-content:center; }

  /* Telefoni: sidebar in alto, contenuto a tutta larghezza */
  @media (max-width: 760px) {
    .app-shell { flex-direction:column; }
    .sidebar { width:100%; flex-direction:row; align-items:center; gap:12px;
      padding:12px 16px; border-right:none; border-bottom:1px solid var(--line); }
    .sidebar .logo { margin-bottom:0; }
    .sidebar nav { display:flex; }
    .nav-item { padding:7px 11px; }
    .sidebar .user { border-top:none; padding-top:0; }
    .sidebar .user .role { display:none; }
    .main { padding:18px 16px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" style="display:none">
  <div class="logo">Meta<span>Reality</span></div>
  <h2>Accesso redazione</h2>
  <p>Inserisci la password per gestire i progetti.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
  <button class="btn primary" id="loginBtn">Entra</button>
  <div class="err" id="loginErr"></div>
</section>

<!-- APP -->
<div class="app-shell" id="app" style="display:none">
  <aside class="sidebar">
    <div class="logo">Meta<span>Reality</span></div>
    <nav><a class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 8z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg> Progetti</a></nav>
    <div class="user">
      <div class="role">Redazione</div>
      <button class="btn ghost sm" id="logoutBtn">Esci</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Progetti</h1><p id="sub">…</p></div>
      <div class="topbar-actions">
        <button id="themeBtn" title="Tema chiaro / scuro"></button>
        <label class="btn" id="customBtn" style="cursor:pointer" title="Carica un progetto custom (.zip dell'SDK)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 8z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg> Progetto custom (.zip)<input type="file" id="customFile" accept=".zip,application/zip" style="display:none"></label>
        <button class="btn primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg> Nuovo progetto</button>
      </div>
    </div>
    <div class="searchbar"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input id="search" type="text" placeholder="Cerca progetto…" autocomplete="off"></div>
    <div class="filter-row" id="filterRow"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- MODAL NUOVO / MODIFICA -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Nuovo progetto</div>
    <label>Nome</label>
    <input id="mName" type="text" placeholder="Nome del progetto">
    <label>Tag (separati da virgola)</label>
    <input id="mTags" type="text" placeholder="es. sicurezza, cantiere, VR">
    <label>Copertina (mostrata durante il caricamento in play)</label>
    <div class="cover-edit">
      <div class="cover-prev" id="mCoverPrev"></div>
      <div class="cover-controls">
        <input id="mCover" type="text" placeholder="URL immagine (opzionale)">
        <label class="btn ghost sm" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Carica immagine
          <input type="file" id="mCoverFile" accept="image/*" style="display:none">
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="mSave">Salva</button>
      <button class="btn ghost" id="mCancel">Annulla</button>
    </div>
  </div>
</div>

<!-- MODAL ELIMINA -->
<div class="modal-overlay" id="delModal">
  <div class="modal-box">
    <div class="modal-title">Eliminare il progetto?</div>
    <p style="font-size:.85rem;color:var(--muted)" id="delMsg"></p>
    <div class="modal-actions">
      <button class="btn red" id="delOk">Elimina</button>
      <button class="btn ghost" id="delCancel">Annulla</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, Object.assign({ headers: { 'Content-Type': 'application/json' } }, o));

/* Icone SVG a tratto (stile Lucide) — niente emoji */
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  pencil:   SVG('<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>'),
  play:     SVG('<polygon points="6 4 20 12 6 20 6 4"/>'),
  copy:     SVG('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  download: SVG('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
  sliders:  SVG('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
  globe:    SVG('<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'),
  lock:     SVG('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),
  trash:    SVG('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
  sun:      SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
  moon:     SVG('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>'),
  box:      SVG('<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 8z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/>'),
};

let PROJECTS = [];
let activeTag = null;
let editingSlug = null;     // null = nuovo progetto
let deletingSlug = null;
let coverFile = null;       // file copertina selezionato nella modale

/* ── Tema chiaro/scuro ── */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('sc-admin-theme', t);
  $('#themeBtn').innerHTML = t === 'dark' ? I.sun : I.moon;
}
applyTheme(document.documentElement.dataset.theme);
$('#themeBtn').onclick = () =>
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ── Carica progetto custom (.zip dell'SDK): crea progetto → scompatta → carica i file → apre l'editor custom ── */
if ($('#customFile')) $('#customFile').addEventListener('change', uploadCustomProject);
async function uploadCustomProject(e) {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (typeof JSZip === 'undefined') { alert('JSZip non disponibile (connessione?)'); return; }
  let zip; try { zip = await JSZip.loadAsync(file); } catch { alert('ZIP non valido'); return; }
  let mEntry = null;   // il project.json più "in alto" nello zip
  zip.forEach((path, entry) => { if (!entry.dir && /(^|\/)project\.json$/i.test(path) && (!mEntry || path.length < mEntry.name.length)) mEntry = entry; });
  if (!mEntry) { alert('Manca project.json nel bundle'); return; }
  let manifest; try { manifest = JSON.parse(await mEntry.async('string')); } catch { alert('project.json non valido'); return; }
  const baseDir = mEntry.name.replace(/project\.json$/i, '');   // cartella che contiene il manifest
  const files = [];
  zip.forEach((path, entry) => { if (!entry.dir && path.startsWith(baseDir)) files.push({ rel: path.slice(baseDir.length), entry }); });
  if (!files.length) { alert('Bundle vuoto'); return; }
  const name = manifest.name || file.name.replace(/\.zip$/i, '');
  $('#sub').textContent = 'Creo il progetto custom…';
  const cr = await api('/api/projects', { method: 'POST', body: JSON.stringify({ name, tags: ['custom'] }) });
  if (!cr.ok) { alert('Creazione progetto fallita (' + cr.status + ')'); load(); return; }
  const slug = (await cr.json()).slug;
  let done = 0;
  for (const f of files) {
    if (!f.rel) continue;
    $('#sub').textContent = `Carico bundle… ${++done}/${files.length} · ${f.rel}`;
    const blob = await f.entry.async('blob');
    const fd = new FormData();
    fd.append('file', new File([blob], f.rel.split('/').pop(), { type: 'application/octet-stream' }));
    fd.append('path', f.rel);
    const up = await fetch('/api/projects/' + encodeURIComponent(slug) + '/custom-file', { method: 'POST', body: fd });
    if (!up.ok) { alert('Upload fallito: ' + f.rel + ' (' + up.status + ')'); load(); return; }
  }
  location.href = '/custom.html?project=' + encodeURIComponent(slug) + '&edit';
}

async function refresh() {
  const me = await (await api('/api/me')).json();
  if (!me.authed) { $('#login').style.display = 'block'; $('#app').style.display = 'none'; $('#pw').focus(); return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'flex';
  await load();
}

async function load() {
  const r = await api('/api/projects');
  PROJECTS = r.ok ? await r.json() : [];
  $('#sub').textContent = `${PROJECTS.length} progett${PROJECTS.length === 1 ? 'o' : 'i'}`;
  buildFilters();
  render();
}

function buildFilters() {
  const tags = [...new Set(PROJECTS.flatMap(p => p.tags || []))].sort();
  const row = $('#filterRow');
  row.innerHTML = '<span class="filter-label">Tag:</span>';
  const mk = (label, val) => {
    const c = document.createElement('button');
    c.className = 'filter-chip' + (activeTag === val ? ' active' : '');
    c.textContent = label;
    c.onclick = () => { activeTag = val; buildFilters(); render(); };
    row.appendChild(c);
  };
  mk('Tutti', null);
  tags.forEach(t => mk(t, t));
}

function render() {
  const q = $('#search').value.trim().toLowerCase();
  const grid = $('#grid');
  let items = PROJECTS.filter(p =>
    (!activeTag || (p.tags || []).includes(activeTag)) &&
    (!q || p.name.toLowerCase().includes(q) || p.slug.includes(q)));
  if (!items.length) { grid.innerHTML = '<div class="empty">Nessun progetto. Creane uno con “＋ Nuovo progetto”.</div>'; return; }
  grid.innerHTML = '';
  for (const p of items) {
    const date = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString('it-IT') : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (items.indexOf(p) * 0.06) + 's';   // entrata a cascata
    const tagsHtml = (p.tags || []).map(t => `<span class="tag"></span>`).join('');
    const coverHtml = p.cover
      ? `<div class="thumb" style="background-image:url('${p.cover.replace(/'/g, '%27')}')"></div>`
      : `<div class="thumb ph">${I.box}</div>`;
    const ev = p.custom ? '/custom.html?project=' : '/?project=';   // i custom si aprono in custom.html
    card.innerHTML = coverHtml +
        `<div class="top"><div><div class="name"></div><div class="meta">${p.slug} · ${date}${p.custom ? ' · custom' : ''}</div></div>`
      +   `<span class="status ${p.status}">${p.status === 'published' ? 'Pubblicato' : 'Bozza'}</span></div>`
      + `<div class="tags">${tagsHtml}</div>`
      + `<div class="actions first">`
      +   `<a class="btn sm accent" href="${ev}${encodeURIComponent(p.slug)}&edit">${I.pencil} Editor</a>`
      +   `<a class="btn sm" href="${ev}${encodeURIComponent(p.slug)}" target="_blank">${I.play} Play</a>`
      + `</div>`
      + `<div class="actions mid">`
      +   `<button class="btn sm" data-a="dup">${I.copy} Duplica</button>`
      +   `<a class="btn sm" href="/api/projects/${encodeURIComponent(p.slug)}/download">${I.download} Scarica</a>`
      +   `<button class="btn sm" data-a="edit">${I.sliders} Modifica</button>`
      + `</div>`
      + `<div class="actions last">`
      +   `<button class="btn sm ${p.status === 'published' ? '' : 'green'}" data-a="pub" title="${p.status === 'published' ? 'Mette in bozza: lo vede solo la redazione' : 'Rende pubblico: link play per tutti'}">${p.status === 'published' ? I.lock + ' Rendi privato' : I.globe + ' Pubblica'}</button>`
      +   `<button class="btn sm red" data-a="del" title="Elimina">${I.trash}</button>`
      + `</div>`;
    card.querySelector('.name').textContent = p.name;
    card.querySelectorAll('.tag').forEach((el, i) => el.textContent = p.tags[i]);
    card.querySelector('[data-a="pub"]').onclick = async () => {
      await api('/api/projects/' + encodeURIComponent(p.slug), { method: 'PUT',
        body: JSON.stringify({ status: p.status === 'published' ? 'draft' : 'published' }) });
      load();
    };
    card.querySelector('[data-a="dup"]').onclick = async () => {
      const r = await api('/api/projects/' + encodeURIComponent(p.slug) + '/duplicate', { method: 'POST' });
      if (r.ok) load(); else alert('Errore nella duplicazione');
    };
    card.querySelector('[data-a="edit"]').onclick = () => openModal(p);
    card.querySelector('[data-a="del"]').onclick = () => { deletingSlug = p.slug; $('#delMsg').textContent = `"${p.name}" — i modelli su R2 restano.`; $('#delModal').classList.add('show'); };
    grid.appendChild(card);
  }
}

/* ── Modal nuovo/modifica ── */
function openModal(project) {
  editingSlug = project ? project.slug : null;
  coverFile = null;
  $('#modalTitle').textContent = project ? 'Modifica progetto' : 'Nuovo progetto';
  $('#mName').value = project ? project.name : '';
  $('#mTags').value = project ? (project.tags || []).join(', ') : '';
  $('#mCover').value = project ? (project.cover || '') : '';
  $('#mCoverPrev').style.backgroundImage = project && project.cover ? `url('${project.cover}')` : 'none';
  $('#mSave').textContent = project ? 'Salva modifiche' : 'Crea e apri editor';
  $('#editModal').classList.add('show');
  setTimeout(() => $('#mName').focus(), 50);
}
function closeModal() { $('#editModal').classList.remove('show'); }
$('#newBtn').onclick = () => openModal(null);
$('#mCancel').onclick = closeModal;
$('#mCoverFile').addEventListener('change', e => {
  coverFile = e.target.files[0] || null;
  if (coverFile) {
    const reader = new FileReader();
    reader.onload = () => $('#mCoverPrev').style.backgroundImage = `url('${reader.result}')`;
    reader.readAsDataURL(coverFile);
  }
});
$('#mSave').onclick = async () => {
  const name = $('#mName').value.trim();
  if (!name) { $('#mName').focus(); return; }
  const tags = $('#mTags').value.split(',').map(s => s.trim()).filter(Boolean);
  const coverUrl = $('#mCover').value.trim();
  const isNew = !editingSlug;
  let slug = editingSlug;

  if (isNew) {
    const r = await api('/api/projects', { method: 'POST', body: JSON.stringify({ name, tags }) });
    if (!r.ok) { alert('Errore nella creazione'); return; }
    slug = (await r.json()).slug;
  } else {
    await api('/api/projects/' + encodeURIComponent(slug), { method: 'PUT', body: JSON.stringify({ name, tags }) });
  }
  // Copertina: file caricato → upload; altrimenti URL
  if (coverFile) {
    const fd = new FormData(); fd.append('cover', coverFile);
    await fetch('/api/projects/' + encodeURIComponent(slug) + '/cover', { method: 'POST', body: fd });
  } else if (coverUrl) {
    await api('/api/projects/' + encodeURIComponent(slug), { method: 'PUT', body: JSON.stringify({ cover: coverUrl }) });
  }

  if (isNew) location.href = `/?project=${encodeURIComponent(slug)}&edit`;
  else { closeModal(); load(); }
};

/* ── Elimina ── */
$('#delCancel').onclick = () => $('#delModal').classList.remove('show');
$('#delOk').onclick = async () => {
  if (deletingSlug) await api('/api/projects/' + encodeURIComponent(deletingSlug), { method: 'DELETE' });
  $('#delModal').classList.remove('show'); deletingSlug = null; load();
};

/* ── Login / logout / search ── */
$('#loginBtn').onclick = doLogin;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  $('#loginErr').textContent = '';
  const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
  if (r.ok) { $('#pw').value = ''; refresh(); } else $('#loginErr').textContent = 'Password errata';
}
$('#logoutBtn').onclick = async () => { await api('/api/logout', { method: 'POST' }); refresh(); };
$('#search').addEventListener('input', render);

refresh();
</script>
</body>
</html>
