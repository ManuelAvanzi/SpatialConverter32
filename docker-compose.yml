services:
  app:
    build: .
    image: spatialconverter:latest
    container_name: spatialconverter
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3003:3003"

    env_file:
      - .env

    environment:
      - PORT=3003
      - NODE_ENV=production

    deploy:
      resources:
        limits:
          memory: 1g
